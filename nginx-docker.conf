# 限制请求速率：每IP每秒最多20个请求，突发30个，超出的延迟处理
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

# 限制连接数：每IP最多10个并发连接
limit_conn_zone $binary_remote_addr zone=addr:10m;

# 上传需求文档、压测 CSV、接口导入等（默认仅 1m，大 Word/PDF 会 413）
client_max_body_size 50m;

server {
    listen 80;
    server_name localhost;

    # 全局安全：拦截常见扫描/探测路径，返回403（会记录到Nginx默认日志，方便排查）
    location ~ ^/(mcp|jsonrpc|sdk|device\.rsp|actuator|env|api/v1|v1|console|jmx-console|admin|wp-login|wp-admin|config|setup|phpmyadmin|\.env|\.git|\.svn|robots\.txt|sitemap|xmlrpc\.php|wlwmanifest\.xml) {
        return 403;
    }

    # 全局限流和连接数限制
    limit_req zone=general burst=30 nodelay;
    limit_conn addr 10;

    # WebSocket 支持 - 设备实时画面 /sys/devices/ws/（必须放在正则 location 之前）
    location ^~ /sys/devices/ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 产品功能演示静态页（showcase/，含 mp4 录屏）
    location = /showcase {
        return 301 /showcase/;
    }
    location ^~ /showcase/ {
        alias /usr/share/nginx/showcase/;
        index index.html;
    }

    # 前端静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 代理 - 系统管理
    location ~ ^/(login|register|verify|refresh|user|role|token|update|delete|active) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Runner 客户端大文件下载（约 800MB，需更长超时与流式转发）
    location = /runner/client-download {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # 后端 API 代理 - 测试平台相关接口（包含 run 执行接口）
    location ~ ^/(project|environment|module|case|suite|task|cronjob|runner|run|device|result|export) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # AI 助手（一次性 JSON，读超时略长）
    location ^~ /ai/assistant/chat {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 360s;
        proxy_read_timeout 360s;
    }

    # BrickCore MCP Server（Streamable HTTP，非默认路径降低扫描命中）
    location ^~ /brickcore/agent-hub {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    # 后端 API 代理 - 重构后的新路由前缀
    location ~ ^/(sys|ui|schedule|api-module|perf|ai)/ {
        client_max_body_size 50m;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 3600s;
        # SSE / 长连接：禁用缓冲，确保流式与 AI 长任务实时传递
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_set_header Connection '';
        gzip off;
    }

    # Swagger 文档
    location ~ ^/(swagger|redoc|openapi\.json) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 静态文件 (Swagger UI 等)
    location ^~ /static/ {
        proxy_pass http://backend:8000/static/;
    }

    # WebSocket 支持 - /ws/ 通用路径
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 前端静态文件缓存（开发阶段 JS/CSS 不缓存，其他资源长期缓存）
    location ~* \.(js|css)$ {
        root /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
