# CE 演示环境专用（同步时覆盖 docker-services.yml，Pro 私有仓不改）
services:
  mysql:
    image: mysql:8.0
    container_name: fastapi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: BrickCore123456
      MYSQL_DATABASE: fastapi
      MYSQL_USER: admin
      MYSQL_PASSWORD: BrickCore123456
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    container_name: fastapi-redis
    command: redis-server --requirepass BrickCore123456
    ports:
      - "26379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fastapi-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: BrickCore123456
    ports:
      - "25672:5672"
      - "35672:15672"

  minio:
    image: minio/minio:latest
    container_name: fastapi-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: BrickCore123456
    ports:
      - "9200:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  mysql_data:
  minio_data:
