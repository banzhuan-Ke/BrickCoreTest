name: Build BrickCore Runner (macOS)

on:
  workflow_dispatch:
    inputs:
      skip_nuitka:
        description: "Skip Nuitka (dev only, keeps .py sources)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    tags:
      - "runner-mac-*"

jobs:
  build-macos-arm64:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build macOS runner package
        run: |
          chmod +x scripts/build_runner_mac.sh
          args=()
          if [ "${{ inputs.skip_nuitka || 'false' }}" = "true" ]; then
            args+=(--skip-nuitka)
          fi
          ./scripts/build_runner_mac.sh "${args[@]}"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrickCoreRunner-mac-arm64
          path: runner_client/dist/BrickCoreRunner-mac.zip
          if-no-files-found: error

      - name: Upload folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrickCoreRunner-mac-arm64-dir
          path: runner_client/dist/BrickCoreRunner-mac/
          if-no-files-found: error
